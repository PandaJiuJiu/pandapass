# PandaPass all-in-one nginx config.
# Serves the web UI on :8080 and proxies /api/ to the local pandapass-server on :8233.

worker_processes 1;
daemon off;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nonroot can't write /var/log/nginx; log to a world-writable path
    access_log /tmp/nginx-access.log;
    error_log /dev/stderr warn;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Upstream is the local pandapass-server
    upstream pandapass_api {
        server 127.0.0.1:8233;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA routing: unknown paths return index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy to local server
        location /api/ {
            proxy_pass http://pandapass_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Never cache credential material
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Static assets (hashed filenames) - cache aggressively
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html must never be cached
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        client_max_body_size 2m;
    }
}