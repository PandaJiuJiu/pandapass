# PandaPass web UI. Serves the built bundle and proxies the API to the server
# container, so the browser only ever talks to one origin and the session
# cookie stays first-party.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A vault UI should not be indexable, referrable, or embeddable.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The SPA owns routing, so unknown paths return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://pandapass:8233;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audit queries and batch writes are bounded server-side, but the
        # timeout here is the backstop for a stuck request.
        proxy_read_timeout 60s;
    }

    # Hashed asset filenames are immutable, so they can be cached hard. The
    # entry HTML must not be, or a deploy leaves browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Credential material must never be written to a disk cache or a log.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    client_max_body_size 2m;
}
