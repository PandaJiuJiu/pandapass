# PandaPass — single-host deployment.
#
# All-in-one container: nginx (web UI on :8080) and pandapass-server (:8233)
# run side by side in one image, supervised by s6-overlay. nginx proxies
# /api/ to the local server, so the browser only ever talks to one origin.
#
# The design assumption is that this runs on a machine you control, reachable
# over Tailscale or a VPN. Do not expose port 8233 to the public internet: the
# server holds an age private key that can unwrap every envelope, so an
# unauthenticated network path to it is a path to every secret in the vault.

services:
  pandapass:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/pandajiujiu/pandapass:0.0.1
    restart: unless-stopped

    # Web UI on 8080, API on 8233, dynamic PostgreSQL proxy on 5433, dynamic
    # Redis proxy on 6380. All loopback-only; clients reach them over the same
    # VPN as the API. Put a TLS-terminating reverse proxy in front (or set
    # PANDAPASS_PUBLIC_URL and expose deliberately) rather than publishing 8233
    # on all interfaces.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8233:8233"
      # Dynamic credential proxy (M2): PostgreSQL wire protocol.
      - "127.0.0.1:5433:5433"
      # Dynamic credential proxy (M2, D8): Redis RESP protocol.
      - "127.0.0.1:6380:6380"

    environment:
      # ── core ──────────────────────────────────────────────────────────────
      # Three slashes is correct. `sqlite://data/...` is a *relative* path, and
      # the server would then write inside the container instead of the volume,
      # losing every secret on each recreate.
      PANDAPASS_DB_URL: sqlite:///data/pandapass.db?mode=rwc
      PANDAPASS_LISTEN: 0.0.0.0:8233
      PANDAPASS_PUBLIC_URL: ${PANDAPASS_PUBLIC_URL:-http://localhost:8080}

      # ── server age key ────────────────────────────────────────────────────
      # Read from a file so the private key never appears in the process
      # environment, where `docker inspect` would show it. Generated on first
      # boot by `pandapass-server --init` (inside the image's s6 run script)
      # into /data/server-age.key.
      PANDAPASS_SERVER_AGE_IDENTITY_FILE: /data/server-age.key

      # ── audit chain key ───────────────────────────────────────────────────
      # Independent 32-byte hex key. Lives on the same volume as the DB so the
      # two back up together; the chain key is independent of the age identity
      # so rotating one does not invalidate the other.
      PANDAPASS_AUDIT_CHAIN_KEY_FILE: /data/audit-chain.key

      # ── auth & sessions ───────────────────────────────────────────────────
      # Off by default and kept off: a vault that hands accounts to whoever
      # finds the URL is not a vault. The first-run web setup creates the admin
      # without this flag; it only opens self-service signups later.
      PANDAPASS_ALLOW_REGISTRATION: ${PANDAPASS_ALLOW_REGISTRATION:-false}

      # Force TOTP on every account. Worth turning on for any real deployment.
      PANDAPASS_REQUIRE_TOTP: ${PANDAPASS_REQUIRE_TOTP:-false}

      # Absolute session lifetime (days) and idle timeout (seconds). Idle is
      # 0 (unset) by default: only the absolute TTL applies. Set both in
      # production.
      PANDAPASS_SESSION_TTL_DAYS: ${PANDAPASS_SESSION_TTL_DAYS:-30}
      PANDAPASS_SESSION_IDLE_TIMEOUT_SECS: ${PANDAPASS_SESSION_IDLE_TIMEOUT_SECS:-}

      # Login rate limit per IP. The defaults (5 attempts / 15 minutes) are
      # tuned for single-user; loosen for a busy shared host.
      PANDAPASS_AUTH_RATE_LIMIT_MAX: ${PANDAPASS_AUTH_RATE_LIMIT_MAX:-5}
      PANDAPASS_AUTH_RATE_LIMIT_WINDOW_SECS: ${PANDAPASS_AUTH_RATE_LIMIT_WINDOW_SECS:-900}

      # ── cookies ───────────────────────────────────────────────────────────
      # Cookies get the Secure flag automatically when PUBLIC_URL is https.
      # Force-override when the public URL doesn't say https but a TLS proxy
      # is in front (common with reverse proxies on a private port).
      PANDAPASS_COOKIE_SECURE: ${PANDAPASS_COOKIE_SECURE:-}

      # ── TLS (optional) ───────────────────────────────────────────────────
      # To enable HTTPS served by the server itself (not a reverse proxy),
      # set all three paths and mount the PEM files into the container.
      # The server auto-generates a self-signed CA + leaf on first boot if
      # the files are missing; you can also provide your own certs.
      #
      # Example (mount host certs at /data/tls/):
      #   PANDAPASS_TLS_CERT_FILE: /data/tls/tls-cert.pem
      #   PANDAPASS_TLS_KEY_FILE: /data/tls/tls-key.pem
      #   PANDAPASS_TLS_CA_FILE: /data/tls/tls-ca.pem
      #   volumes:
      #     - ./tls:/data/tls:ro
      #
      # CLI then pins the CA automatically on first login (TOFU), or manually:
      #   pandapass-cli config set-ca-cert /path/to/ca.pem
      #   pandapass-cli pki ca fingerprint
      # Note: when TLS is enabled, PUBLIC_URL should be https://...
      PANDAPASS_TLS_CERT_FILE: ${PANDAPASS_TLS_CERT_FILE:-}
      PANDAPASS_TLS_KEY_FILE: ${PANDAPASS_TLS_KEY_FILE:-}
      PANDAPASS_TLS_CA_FILE: ${PANDAPASS_TLS_CA_FILE:-}

      # ── CORS ──────────────────────────────────────────────────────────────
      # Comma-separated. Empty means same-origin only, which is right behind
      # nginx serving the web UI from the same host.
      PANDAPASS_ALLOWED_ORIGINS: ${PANDAPASS_ALLOWED_ORIGINS:-}

      # ── trusted reverse proxies ───────────────────────────────────────────
      # nginx sits in front of the server in this image; without this list the
      # server treats every request as coming from 127.0.0.1 and never reads
      # X-Forwarded-For. Comma-separated CIDRs.
      PANDAPASS_TRUSTED_PROXY_CIDRS: ${PANDAPASS_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}

      # ── dynamic credential proxy (M2) ────────────────────────────────────
      # Leave UPSTREAM empty to keep the proxy disabled (the default). When
      # set, the proxy listens on 5433 and forwards PostgreSQL wire traffic
      # to the configured upstream.
      PANDAPASS_DYNAMIC_PROXY_LISTEN: ${PANDAPASS_DYNAMIC_PROXY_LISTEN:-}
      PANDAPASS_DYNAMIC_PROXY_UPSTREAM: ${PANDAPASS_DYNAMIC_PROXY_UPSTREAM:-}

      # Redis dynamic credential proxy (M2, D8): when UPSTREAM is set, the
      # proxy listens on 6380 and forwards Redis RESP traffic to the
      # configured upstream. Same TTL/revocation enforcement as PostgreSQL.
      PANDAPASS_DYNAMIC_PROXY_REDIS_LISTEN: ${PANDAPASS_DYNAMIC_PROXY_REDIS_LISTEN:-}
      PANDAPASS_DYNAMIC_PROXY_REDIS_UPSTREAM: ${PANDAPASS_DYNAMIC_PROXY_REDIS_UPSTREAM:-}

      # ── agent command runner ─────────────────────────────────────────────
      # `pandapass run` refuses to spawn anything not named here, which bounds
      # what an agent can do even with a valid token. Empty = the runner is
      # effectively disabled (every call is rejected).
      PANDAPASS_COMMAND_ALLOWLIST: ${PANDAPASS_COMMAND_ALLOWLIST:-}
      PANDAPASS_COMMAND_TIMEOUT_SECS: ${PANDAPASS_COMMAND_TIMEOUT_SECS:-120}

      # Concurrency cap for the command runner above.
      PANDAPASS_MAX_CONCURRENT_EXEC: ${PANDAPASS_MAX_CONCURRENT_EXEC:-16}

      # ── admin bootstrap (optional, first run only) ────────────────────────
      # With PANDAPASS_BOOTSTRAP=true and PANDAPASS_ADMIN_EMAIL set, the
      # server creates that admin account from PANDAPASS_ADMIN_PASSWORD on
      # first boot (failing if either is missing or already used). The
      # password *does* enter the process environment, which means it shows
      # up in `docker inspect` — only enable this on a host you trust.
      # Otherwise, leave BOOTSTRAP unset and use the web UI's first-run
      # screen, which never touches the process environment.
      PANDAPASS_BOOTSTRAP: ${PANDAPASS_BOOTSTRAP:-}
      PANDAPASS_ADMIN_EMAIL: ${PANDAPASS_ADMIN_EMAIL:-}
      PANDAPASS_ADMIN_PASSWORD: ${PANDAPASS_ADMIN_PASSWORD:-}

      # ── logs ──────────────────────────────────────────────────────────────
      # Structured logs. These carry request metadata only — never secret values.
      RUST_LOG: ${RUST_LOG:-info}

    # ── secrets (mounted as files) ────────────────────────────────────────
    # The audit chain key never enters the process environment; the server
    # reads it from this file path. Drop it in via `docker secret create
    # audit_chain_key <some-32-byte-hex>` and uncomment the bottom-level
    # `secrets:` block. If you don't define the secret, leave the env set
    # to the default path and the chain falls back to the server's age
    # identity (one-time, irreversible choice).
    secrets:
      - source: audit_chain_key
        target: /data/audit-chain.key
        uid: "65532"
        gid: "65532"
        mode: 0400

    volumes:
      # The database, server age key, and audit chain key. This volume is the
      # vault: losing it loses every secret, and losing only the age identity
      # makes every envelope sealed to the server unopenable.
      - pandapass-data:/data

    # `--init` is handled inside the image's s6 run script, so no `command:`
    # override is needed here.
    #
    # read_only and cap_drop ALL are intentionally NOT set: s6-overlay writes
    # /run, nginx needs writable cache dirs and /tmp, and s6-setuidgid needs
    # CAP_SETUID/CAP_SETGID (and fix-perms needs CAP_CHOWN) to drop privileges
    # to nonroot. no-new-privileges is kept.
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pandapass-data:

# ── compose-managed secrets ──────────────────────────────────────────────
# Define `audit_chain_key` in an external secrets manager (e.g. `docker
# secret create`) or via a `secrets:` file. It never appears in the
# container's process environment.
#
# Minimum:
#   echo -n "some-32-byte-hex" | docker secret create audit_chain_key -
#
# Then uncomment the top-level `secrets:` block below.
#
# secrets:
#   audit_chain_key:
#     external: true