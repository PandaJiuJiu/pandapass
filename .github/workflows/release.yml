name: Release

# Tag-triggered release: builds portable pandapass-cli binaries for the
# major platforms and attaches them to the GitHub Release. Non-tag pushes run
# the ordinary CI (ci.yml) instead — no release assets are built for them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: statically linked against musl so the binary runs on any
          # glibc distribution without depending on system libraries.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          # macOS: build both Intel and Apple Silicon.
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          # Windows: MSVC build.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux musl target needs a musl-gcc linker to build static binaries.
      - name: Install musl-tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p pandapass-cli --release --target ${{ matrix.target }}

      - name: Prepare tar.gz (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BIN="target/${{ matrix.target }}/release/pandapass-cli"
          ASSET="pandapass-cli-${TAG}-${{ matrix.name }}.tar.gz"
          mkdir -p dist
          cp "$BIN" "dist/pandapass-cli"
          tar -C dist -czf "$ASSET" pandapass-cli
          echo "asset=$ASSET" >> "$GITHUB_ENV"

      - name: Prepare zip (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BIN="target/${{ matrix.target }}/release/pandapass-cli.exe"
          ASSET="pandapass-cli-${TAG}-windows-x86_64.zip"
          mkdir -p dist
          cp "$BIN" "dist/pandapass-cli.exe"
          (cd dist && 7z a -tzip "../$ASSET" pandapass-cli.exe)
          echo "asset=$ASSET" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.asset }}
          fail_on_unmatched_files: true

  # ── Docker image → GHCR ──────────────────────────────────────────────────
  # On a v* tag, build the all-in-one image (server + web UI, see
  # docker/Dockerfile) and push it to ghcr.io/pandajiujiu/pandapass with the
  # semver tag plus `latest`. The image is single-platform (linux/amd64) for
  # now — the Dockerfile embeds an x86_64 s6-overlay tarball; arm64 support
  # would need a per-arch s6-overlay download first.
  docker:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs packages:write to push to GHCR. Kept job-scoped so
    # the CLI binary job does not inherit the extra permission.
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pandajiujiu/pandapass
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
