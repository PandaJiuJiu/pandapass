name: CI

on:
  push:
    branches: [main]
    # Skip the full CI when a release tag is pushed — release.yml handles it.
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust: fmt + clippy + tests ─────────────────────────────────────────
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # Same exemptions as scripts/regression-test.sh: pre-existing lint debt
      # in core signatures (too_many_arguments, inherent from_str methods,
      # complex policy-engine type). Keeping -D warnings strict otherwise.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::too_many_arguments
          -A clippy::should_implement_trait
          -A clippy::type_complexity

      - name: cargo test --workspace
        run: cargo test --workspace

  # ── Web: type-check + production build ─────────────────────────────────
  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Build (vue-tsc + vite)
        working-directory: web
        run: npm run build

  # ── Browser e2e (non-blocking) ─────────────────────────────────────────────
  # Runs the Playwright suite against a throwaway backend. Kept
  # continue-on-error because it exercises real browsers and can flake on
  # CI infrastructure; the Rust/Web jobs above are the merge gate.
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build debug binaries (server + cli)
        run: cargo build -p pandapass-server -p pandapass-cli

      - name: Run CLI integration tests (Rust)
        run: cargo test --manifest-path integration/cli/Cargo.toml

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: integration/web/package-lock.json

      - name: npm ci
        working-directory: integration/web
        run: npm ci

      - name: Install Playwright chromium
        working-directory: integration/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: integration/web
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: integration/web/playwright-report/
          retention-days: 7
