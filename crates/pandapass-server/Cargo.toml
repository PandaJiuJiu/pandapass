[package]
name = "pandapass-server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
mime = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
pandapass-core = { path = "../pandapass-core" }
pandapass-db = { path = "../pandapass-db" }
sqlx = { workspace = true }
qrcode = "0.14"
async-trait = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The integration tests drive the router in-process, so they need a body
# reader and one-shot dispatch — no HTTP server, no port binding.
http-body-util = "0.1"
# `oneshot`, used to dispatch a request through the router without binding a port.
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The audit-chain tests derive the chain key the way main.rs does, and the
# tamper test recomputes entry hashes the way the logger does.
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
ssh-key = { version = "0.6", features = ["ed25519"] }
rand = "0.8"